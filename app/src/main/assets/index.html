<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HIMED Gestion – WNC</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#F3F5F8;--sf:#fff;--ink:#0F1A2A;--mut:#6B778A;--line:#E4E8EE;--hero:#0F1A2A;--brand:#3355FF;--debt:#E5484D;--ok:#12A150;--chip:#EEF1F6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B111B;--sf:#141C29;--ink:#EAF0F8;--mut:#8B98AC;--line:#253044;--hero:#1B2A44;--brand:#5B7BFF;--debt:#FF6B70;--ok:#3DD27F;--chip:#1E2839}}
:root[data-theme="dark"]{--bg:#0B111B;--sf:#141C29;--ink:#EAF0F8;--mut:#8B98AC;--line:#253044;--hero:#1B2A44;--brand:#5B7BFF;--debt:#FF6B70;--ok:#3DD27F;--chip:#1E2839}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.w{max-width:560px;margin:0 auto;padding:12px 16px 130px}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.top b{display:block;font-size:16px;line-height:1.2}.top small{color:var(--mut);font-size:12px}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:22px 20px 18px}
.hero .l{font-size:13px;opacity:.7}
.hero .n{font-size:38px;font-weight:700;letter-spacing:-.5px;margin:2px 0 14px}
.hero .n span{font-size:16px;font-weight:500;opacity:.7;margin-inline-start:6px}
.hero .s{display:flex;gap:10px}
.hero .s div{flex:1;background:rgba(255,255,255,.09);border-radius:14px;padding:10px 12px}
.hero .s small{display:block;font-size:12px;opacity:.7}
.hero .s b{font-size:15px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 8px}
.sec h2{font-size:15px;margin:0;font-weight:600}
.pill{background:var(--chip);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:500}
.list{background:var(--sf);border-radius:20px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.it:last-child{border:0}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.g{flex:1;min-width:0}
.g b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g small{display:block;color:var(--mut);font-size:12px}
.am{font-weight:700;text-align:end;white-space:nowrap}
.am small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.pay{background:var(--brand);color:#fff;border-radius:14px;padding:6px 12px;font-size:13px;font-weight:600}
.day{font-size:13px;color:var(--mut);margin:16px 4px 6px}
.chip{display:inline-block;border-radius:8px;padding:1px 8px;font-size:11px;font-weight:600;background:var(--chip);color:var(--mut)}
.chip.c{background:color-mix(in srgb,var(--debt) 15%,transparent);color:var(--debt)}
.chip.p{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.empty{padding:26px 16px;text-align:center;color:var(--mut)}
.nav{position:fixed;inset-inline:0;bottom:0;background:var(--sf);border-top:1px solid var(--line);padding:8px 24px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;align-items:center}
.nav .t{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);padding:4px 18px}
.nav .t.on{color:var(--brand);font-weight:600}
.nav .t i{font-style:normal;font-size:20px}
.fab{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;font-size:28px;margin-top:-30px;box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 45%,transparent)}
#ov{position:fixed;inset:0;background:rgba(8,12,20,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#ov.open{opacity:1;pointer-events:auto}
#sh{position:fixed;inset-inline:0;bottom:0;max-width:560px;margin:0 auto;background:var(--sf);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .26s ease;max-height:92%;overflow:auto}
#sh.open{transform:none}
@media (prefers-reduced-motion:reduce){#sh,#ov{transition:none}}
.hd{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
#sh h3{margin:0 0 10px;font-size:17px}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:500;color:var(--mut)}
.seg button.on{background:var(--sf);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 2px 5px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.big{font-size:30px;font-weight:700;text-align:center;padding:14px}
.hint{font-size:13px;color:var(--mut);margin:6px 2px 0;display:flex;justify-content:space-between}
.hint button{color:var(--brand);font-weight:600}
.go{margin-top:16px;width:100%;padding:14px;border-radius:14px;background:var(--brand);color:#fff;font-weight:600;font-size:16px}
.er{color:var(--debt);font-size:13px;min-height:20px;margin-top:8px}
.hide{display:none!important}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0F1A2A"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HIMED">
</head>
<body>
<div class="w">
<div class="top"><div class="logo">H</div><div><b>HIMED Gestion</b><small>WNC</small></div></div>

<section id="vh">
<div class="hero">
<div class="l">Vous devez aux fournisseurs</div>
<div class="n"><span id="sD">0</span><span>DA</span></div>
<div class="s"><div><small>Total des achats</small><b id="sT">0</b></div><div><small>Total réglé</small><b id="sP">0</b></div></div>
</div>
<div class="sec"><h2>Fournisseurs</h2><button class="pill" id="nd">+ Fournisseur</button></div>
<div class="list" id="dl"></div>
<div class="sec"><h2>Sauvegarde</h2></div>
<div class="list">
<div class="it"><div class="g"><b>Exporter les données</b><small>Fichier à garder en lieu sûr</small></div><button class="pay" id="ex">Exporter</button></div>
<div class="it"><div class="g"><b>Importer une sauvegarde</b><small id="bm">Remplace les données actuelles</small></div><button class="pay" id="im">Importer</button><input type="file" id="fi" accept=".json,application/json" class="hide"></div>
</div>
</section>

<section id="vl" class="hide">
<div class="sec"><h2>Historique</h2></div>
<select id="lf"></select>
<div id="ll"></div>
</section>
</div>

<nav class="nav">
<button class="t on" id="th"><i>👥</i>Fournisseurs</button>
<button class="fab" id="fab" aria-label="Nouvelle opération">+</button>
<button class="t" id="tl"><i>🧾</i>Historique</button>
</nav>

<div id="ov"></div>
<div id="sh">
<div class="hd"></div>
<div id="fd" class="hide">
<h3>Nouveau fournisseur</h3>
<label>Nom</label><input id="dn" autocomplete="off">
<label>Téléphone (facultatif)</label><input id="dp" inputmode="tel">
<div class="er" id="e1"></div>
<button class="go" id="sd">Enregistrer le fournisseur</button>
</div>
<div id="fo" class="hide">
<div class="seg" id="sk"><button data-v="purchase" class="on">Achat</button><button data-v="payment">Règlement de dette</button></div>
<label>Fournisseur</label><select id="od"></select>
<div class="hint"><span id="ob"></span><button id="all" class="hide">Tout régler</button></div>
<label>Montant (DA)</label><input class="big" id="oa" type="number" inputmode="decimal" min="0" placeholder="0">
<div id="pw"><label>Mode de paiement</label>
<div class="seg" id="sp"><button data-v="paid" class="on">Payé</button><button data-v="part">Paiement partiel</button><button data-v="credit">Crédit</button></div>
<div id="pp" class="hide"><label>Montant payé maintenant (DA)</label><input id="op2" type="number" inputmode="decimal" min="0" placeholder="0"><div class="hint"><span id="rm"></span></div></div></div>
<label>Date</label><input id="ot" type="date">
<label>Note (facultatif)</label><input id="on" autocomplete="off">
<div class="er" id="e2"></div>
<button class="go" id="so">Enregistrer l'achat</button>
</div>
</div>

<script>
const KEY="himed_wnc_v1";
let S={dists:[],ops:[]},K="purchase",P="paid";
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const num=n=>Number(n).toLocaleString("fr-FR",{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const pa=o=>o.pa!==undefined?o.pa:(o.paid?o.amount:0);
const bal=id=>S.ops.reduce((s,o)=>o.did!==id?s:o.type==="purchase"?s+(o.amount-pa(o)):s-o.amount,0);
const nm=id=>(S.dists.find(x=>x.id===id)||{name:"(supprimé)"}).name;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const hues=[215,160,30,280,340,190];
const av=(name,i)=>{const a=el("div","av",name.trim().charAt(0)),h=hues[i%hues.length];
 a.style.background=`hsl(${h} 70% 50% / .16)`;a.style.color=`hsl(${h} 60% 45%)`;return a};

function render(){
 let tp=0,pd=0,debt=0;
 S.ops.forEach(o=>{if(o.type==="purchase")tp+=o.amount;pd+=o.type==="payment"?o.amount:pa(o)});
 S.dists.forEach(d=>debt+=Math.max(bal(d.id),0));
 $("sD").textContent=num(debt);$("sT").textContent=num(tp)+" DA";$("sP").textContent=num(pd)+" DA";
 const dl=$("dl");dl.textContent="";
 if(!S.dists.length)dl.appendChild(el("div","empty","Aucun fournisseur. Appuyez sur « Nouveau fournisseur » pour ajouter le premier."));
 S.dists.forEach((d,i)=>{
  const b=bal(d.id),r=el("div","it");r.style.cursor="pointer";
  const g=el("div","g");g.append(el("b",null,d.name),el("small",null,d.phone||"Pas de téléphone"));
  const a=el("div","am");a.appendChild(document.createTextNode(b>0?num(b)+" DA":"Aucune dette"));
  a.style.color=b>0?"var(--debt)":"var(--ok)";
  if(b>0)a.appendChild(el("small",null,"À payer"));
  r.append(av(d.name,i),g,a);
  if(b>0){const p=el("button","pay","Régler");p.onclick=e=>{e.stopPropagation();openOp("payment",d.id)};r.appendChild(p)}
  r.onclick=()=>{$("lf").value=d.id;go("l")};
  dl.appendChild(r);
 });
 const fill=(sel,first)=>{const c=sel.value;sel.textContent="";
  if(first)sel.appendChild(new Option(first,""));
  S.dists.forEach(d=>sel.appendChild(new Option(d.name,d.id)));
  if(c)sel.value=c};
 fill($("od"));fill($("lf"),"Tous les fournisseurs");
 hint();renderLog();
}
function hint(){
 const id=$("od").value,b=id?bal(id):0;
 $("ob").textContent=id?(b>0?"Dette actuelle : "+num(b)+" DA":"Aucune dette"):"";
 $("all").classList.toggle("hide",!(K==="payment"&&b>0));
}
function renderLog(){
 const f=$("lf").value,box=$("ll");box.textContent="";
 const list=S.ops.filter(o=>!f||o.did===f).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
 if(!list.length){const l=el("div","list");l.appendChild(el("div","empty","Aucune opération."));box.appendChild(l);return}
 const lst=el("div","list");box.appendChild(lst);
 list.forEach(o=>{
  const r=el("div","it"),g=el("div","g");
  const pay=o.type==="payment",p=pa(o),full=p>=o.amount;
  const chip=el("span","chip "+(pay?"p":full?"":"c"),pay?"Règlement":full?"Achat payé":p>0?"Paiement partiel":"Achat à crédit");
  const info=[!pay&&p>0&&!full?"Payé "+num(p)+" — crédit "+num(o.amount-p):"",o.note||""].filter(Boolean).join(" — ");
  const t=el("b",null,nm(o.did));g.append(t,chip);if(info)g.appendChild(el("small",null,info));g.appendChild(el("small",null,"📅 "+new Date(o.date+"T00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})));
  const a=el("div","am",(pay?"− ":"")+num(o.amount)+" DA");
  a.style.color=pay?"var(--ok)":full?"var(--ink)":"var(--debt)";
  const x=el("button",null,"×");x.style.cssText="color:var(--mut);font-size:20px;padding:0 6px";x.setAttribute("aria-label","Supprimer");
  x.onclick=()=>{if(x.dataset.c){S.ops=S.ops.filter(z=>z.id!==o.id);save();render()}else{x.dataset.c=1;x.textContent="Confirmer ?";x.style.cssText="color:var(--debt);font-size:12px;font-weight:600";setTimeout(()=>{x.dataset.c="";x.textContent="×";x.style.cssText="color:var(--mut);font-size:20px;padding:0 6px"},3000)}};
  r.append(g,a,x);lst.appendChild(r);
 });
}
function go(v){
 $("vh").classList.toggle("hide",v!=="h");$("vl").classList.toggle("hide",v!=="l");
 $("th").classList.toggle("on",v==="h");$("tl").classList.toggle("on",v==="l");
 renderLog();scrollTo(0,0);
}
function sheet(open){$("ov").classList.toggle("open",open);$("sh").classList.toggle("open",open)}
function seg(id,v){[...$(id).children].forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
function setK(v){K=v;seg("sk",v);$("pw").classList.toggle("hide",v==="payment");
 $("so").textContent=v==="payment"?"Enregistrer le règlement":"Enregistrer l'achat";hint()}
function openOp(kind,did){
 if(!S.dists.length){openD();return}
 $("fd").classList.add("hide");$("fo").classList.remove("hide");
 setK(kind||"purchase");if(did)$("od").value=did;
 $("oa").value=$("on").value="";$("ot").value=today();P="paid";seg("sp","paid");$("pp").classList.add("hide");$("op2").value="";$("rm").textContent="";$("e2").textContent="";hint();sheet(true);
}
function openD(){$("fo").classList.add("hide");$("fd").classList.remove("hide");$("dn").value=$("dp").value="";$("e1").textContent="";sheet(true);setTimeout(()=>$("dn").focus(),280)}

$("th").onclick=()=>go("h");$("tl").onclick=()=>go("l");
$("fab").onclick=()=>openOp("purchase");$("nd").onclick=openD;$("ov").onclick=()=>sheet(false);
$("sk").onclick=e=>{if(e.target.dataset.v)setK(e.target.dataset.v)};
function rem(){const a=parseFloat($("oa").value)||0,p=parseFloat($("op2").value)||0;$("rm").textContent=a>0&&p>0?"Reste à crédit : "+num(Math.max(a-p,0))+" DA":""}
$("sp").onclick=e=>{if(e.target.dataset.v){P=e.target.dataset.v;seg("sp",P);$("pp").classList.toggle("hide",P!=="part");rem()}};
$("op2").oninput=rem;$("oa").oninput=rem;
$("od").onchange=hint;$("lf").onchange=renderLog;
$("all").onclick=()=>{$("oa").value=bal($("od").value)};
$("sd").onclick=()=>{
 const n=$("dn").value.trim();
 if(!n)return $("e1").textContent="Saisissez le nom du fournisseur.";
 if(S.dists.some(d=>d.name===n))return $("e1").textContent="Ce fournisseur existe déjà.";
 S.dists.push({id:uid(),name:n,phone:$("dp").value.trim()});save();render();sheet(false);
};
$("so").onclick=()=>{
 const did=$("od").value,amt=parseFloat($("oa").value);
 if(!did)return $("e2").textContent="Choisissez un fournisseur.";
 if(!(amt>0))return $("e2").textContent="Saisissez un montant supérieur à zéro.";
 if(K==="payment"&&amt>bal(did))return $("e2").textContent="Le montant dépasse la dette actuelle ("+num(Math.max(bal(did),0))+" DA).";
 let pp=0;
 if(K==="purchase"){pp=P==="paid"?amt:P==="part"?parseFloat($("op2").value):0;
  if(P==="part"&&!(pp>0&&pp<amt))return $("e2").textContent="Le montant payé doit être supérieur à zéro et inférieur au montant de l'achat."}
 S.ops.push({id:uid(),ts:Date.now(),did,type:K,amount:amt,pa:pp,note:$("on").value.trim(),date:$("ot").value||today()});
 save();render();sheet(false);
};
$("ex").onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="himed-sauvegarde-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
 $("bm").textContent="Sauvegarde exportée."};
$("im").onclick=()=>$("fi").click();
$("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.dists)||!Array.isArray(d.ops))throw 0;
  S=d;save();render();$("bm").textContent="Sauvegarde importée."}catch(x){$("bm").textContent="Fichier invalide."}};
 r.readAsText(f);e.target.value=""};
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body>
</html>
